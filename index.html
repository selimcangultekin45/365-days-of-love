<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selimcan ❤️ Lia</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>">
    <meta property="og:title" content="Selimcan ❤️ Lia">
    <meta property="og:description" content="Our little love story">
    <meta property="og:image" content="https://em-content.zobj.net/source/apple/354/red-heart_2764-fe0f.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Başlık -->
        <h1 class="main-title">Selimcan <span class="heart-icon">❤️</span> Lia</h1>
        <p class="sub-title">Our little love story</p>

        <!-- Sayaç Kutusu -->
        <div class="counter-box">
            <span class="together-label">TOGETHER FOR</span>
            <div id="counter" class="counter"></div>
        </div>

        <!-- Butonlar (Sınıf isimleri kaldırıldı, stil doğrudan CSS'ten çekilecek) -->
        <button id="messageButton">✉️ Open Today's Message</button>
        <button id="viewPastButton">📜 View Past Messages</button>

        <!-- Açılan Mesaj Kutusu -->
        <div id="messageBox" class="message-card" style="display:none;">
            <div class="card-envelope">💌</div>
            <div id="dailyMessage" class="card-text"></div>
            <div id="nextCountdown" class="card-countdown"></div>
        </div>

        <!-- Alt Bilgi -->
        <div class="footer-text">Made with ❤️ for Lia</div>
    </div>

    <!-- Geçmiş Mesajlar Penceresi -->
    <div id="pastModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>
            <h2>Past Messages</h2>
            <div class="filter-btns">
                <button id="btnAll" class="active">All</button>
                <button id="btnFav">Favorites ❤️</button>
            </div>
            <div id="pastMessagesList"></div>
        </div>
    </div>

    <!-- Scriptler -->
    <script src="messages.js"></script>
    <script src="script.js"></script>
</body>
</html>
