<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selimcan ❤️ Lia</title>
    <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
    <div class="container">
        <h1>Selimcan ❤️ Lia</h1>
        <p class="subtitle">Our little love story</p>

        <div class="counter-box">
            <h2>Together for</h2>
            <div id="counter">Loading...</div>
        </div>

        <div class="buttons-container">
            <button id="messageButton" class="btn">💌 Open Today's Message</button>
            <button id="viewPastButton" class="btn secondary-btn">📜 View Past Messages</button>
        </div>

        <!-- Günün Mesajı Kutusu (Animasyonlu) -->
        <div id="messageBox" class="message-card" style="display:none;">
            <div class="envelope-icon">💌</div>
            <p id="dailyMessage"></p>
            <div id="nextCountdown" class="next-countdown"></div>
        </div>

        <footer>
            Made with ❤️ for Lia
        </footer>
    </div>

    <!-- Geçmiş Mesajlar & Favoriler Modal -->
    <div id="pastModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Past Messages</h3>
                <span id="closeModal" class="close-btn">&times;</span>
            </div>
            <div id="pastMessagesList"></div>
        </div>
    </div>

    <script src="messages.js?v=11"></script>
    <script src="script.js?v=11"></script>
</body>
</html>
