<!DOCTYPE html>   
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. Tarayıcı Sekme Başlığı -->
    <title>Selimcan & Lia | Our 365 Days ❤️</title>

    <!-- 2. Sekme İkonu (Küçük Kalp Simgesi) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>">

    <!-- 3. WhatsApp/Instagram Link Önizleme Etiketleri -->
    <meta property="og:title" content="Selimcan & Lia ❤️">
    <meta property="og:description" content="A special message for you every single day for 365 days.">
    <meta property="og:image" content="https://em-content.zobj.net/source/apple/354/red-heart_2764-fe0f.png">

    <link rel="stylesheet" href="style.css">
</head>
    
<body>

    <div class="container">
        <h1>Selimcan ❤️ Lia</h1>
        <p class="subtitle">Our little love story</p>

        <div class="counter-box">
            <h2>TOGETHER FOR</h2>
            <div id="counter">Loading...</div>
        </div>

        <div class="buttons-container">
            <button id="messageButton" class="btn">✉️ Open Today's Message</button>
            <button id="viewPastButton" class="btn secondary-btn">📜 View Past Messages</button>
        </div>

        <div id="messageBox" class="message-card" style="display: none;">
            <div class="envelope-icon">💌</div>
            <div id="dailyMessage">...</div>
            <div id="nextCountdown" class="next-countdown"></div>
        </div>

        <footer>Made with ❤️ for Lia</footer>
    </div>

    <!-- Geçmiş Mesajlar Modalı -->
    <div id="pastModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Past Messages</h3>
                <span id="closeModal" class="close-btn">&times;</span>
            </div>
            
            <!-- Filtre Butonları -->
            <div class="filter-container">
                <button id="btnAll" class="filter-btn active">All</button>
                <button id="btnFav" class="filter-btn">Favorites ❤️</button>
            </div>

            <!-- Mesaj Listesi -->
            <div id="pastMessagesList"></div>
        </div>
    </div>

    <script src="messages.js"></script>
    <script src="script.js"></script>
</body>
</html>
