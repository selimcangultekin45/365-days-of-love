<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selimcan ❤️ Lia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Selimcan ❤️ Lia</h1>
        <p class="subtitle">Our little love story</p>

        <div class="counter-box">
            <h2>Together for</h2>
            <div id="counter">Loading...</div>
        </div>

        <div class="buttons-container">
            <button id="messageButton" class="btn">💌 Open Today's Message</button>
            <button id="viewPastButton" class="btn secondary-btn">📜 View Past Messages</button>
        </div>

        <div id="messageBox" class="message-card" style="display:none;">
            <div class="envelope-icon">💌</div>
            <p id="dailyMessage"></p>
        </div>

        <!-- Geçmiş Mesajlar Penceresi -->
        <div id="pastModal" class="modal" style="display:none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Past Messages</h3>
                    <span id="closeModal" class="close-btn">&times;</span>
                </div>
                <div id="pastMessagesList"></div>
            </div>
        </div>

        <footer>
            Made with ❤️ for Lia
        </footer>
    </div>

    <script src="messages.js?v=7"></script>
    <script src="script.js?v=7"></script>
</body>
</html>
